# Task Monitor 示例配置文件

spring:
  application:
    name: task-monitor-example

# 任务监控配置
task:
  monitor:
    # 启用任务监控
    enabled: true

    # 存储类型: memory（内存）, redis（Redis）, database（数据库）
    storage-type: memory

    # 心跳监控配置
    heartbeat:
      # 启用心跳监控
      enabled: true
      # 默认心跳间隔（秒）
      interval-seconds: 60
      # 健康检查间隔（秒）
      check-interval-seconds: 30
      # 超时阈值（倍数）
      timeout-threshold: 2

    # 重试配置
    retry:
      # 默认最大重试次数
      max-retry: 3
      # 可重试的异常类型
      retryable-exceptions:
        - java.util.concurrent.TimeoutException
        - java.io.IOException
        - java.sql.SQLException
        - org.springframework.dao.DataAccessException
      # 可忽略的异常类型
      ignorable-exceptions:
        - java.lang.IllegalArgumentException
        - java.lang.NullPointerException

    # 恢复配置
    recovery:
      # 启用自动恢复
      enabled: true
      # 默认恢复策略: AUTO（自动）, ALWAYS（总是）, NEVER（从不）, CUSTOM（自定义）
      default-strategy: AUTO

    # 序列化配置
    serialization:
      # 最大参数大小（字节）
      max-param-size-bytes: 10240

    # 清理配置
    cleanup:
      # 启用定期清理
      enabled: true
      # 保留天数
      retention-days: 7
      # 清理任务执行时间（cron表达式）
      schedule-cron: "0 0 2 * * ?"

# 日志配置
logging:
  level:
    cn.rhymed.task.monitor: DEBUG
    examples: DEBUG

---
# Redis存储配置示例
spring:
  config:
    activate:
      on-profile: redis

task:
  monitor:
    storage-type: redis

spring:
  redis:
    host: localhost
    port: 6379
    password: your-password
    database: 0

---
# 数据库存储配置示例
spring:
  config:
    activate:
      on-profile: database

task:
  monitor:
    storage-type: database

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/task_monitor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis:
  type-aliases-package: cn.rhymed.task.monitor.infrastructure.persistence.database.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
